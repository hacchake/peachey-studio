[package]
name = "peel-host-vst3"
description = "VST3 plugin host for Peachey Studio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
peel-dsp.workspace = true
vst3 = "0.3"
libloading = "0.8"
log.workspace = true
rtrb.workspace = true
peel-plugin-window = { path = "../peel-plugin-window" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

# プラグインを別プロセスで調べるヘルパー。読み込み中に落ちたり固まったり
# するプラグインがあっても、アプリ本体は巻き込まれない。
[[bin]]
name = "peel-vst3-scan"
path = "src/bin/peel-vst3-scan.rs"
