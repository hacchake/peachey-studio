[package]
name = "peel-engine"
description = "Realtime audio engine for Peachey Studio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
peel-dsp.workspace = true
peel-time.workspace = true
rtrb.workspace = true
cpal.workspace = true
log.workspace = true
thiserror.workspace = true
serde.workspace = true
assert_no_alloc = { version = "1.1.2", optional = true }

[features]
default = []
# Wraps the realtime callback in `assert_no_alloc`. The final binary must also
# install `assert_no_alloc::AllocDisabler` as its global allocator (see the
# crate documentation of `peel_engine::rt`).
rt-check = ["dep:assert_no_alloc"]
