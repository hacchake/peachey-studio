[package]
name = "peel-project"
description = "Project persistence for Peachey Studio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
peel-document.workspace = true
serde.workspace = true
# `float_roundtrip` makes parsing an f64 return exactly the value that was
# written, which tempo and parameter values rely on for lossless saves.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
blake3.workspace = true
# Bundles are plain deflate/stored ZIPs; no encryption or exotic codecs.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
