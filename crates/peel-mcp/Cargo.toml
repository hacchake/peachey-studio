[package]
name = "peel-mcp"
description = "MCP tools for Peachey Studio's desktop and headless sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
peel-document.workspace = true
peel-session.workspace = true
peel-devices.workspace = true
peel-dsp.workspace = true
peel-media.workspace = true
peel-midi.workspace = true
peel-compose.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io"] }
schemars = "1.2"
tokio = { version = "1", features = ["rt", "sync", "time", "fs", "io-std"] }
libc = "0.2"
json-patch = { version = "5", default-features = false, features = ["schemars"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
peel-host-clap = { path = "../peel-host-clap" }
