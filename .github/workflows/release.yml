name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest }
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.7"
      - name: Package macOS
        if: runner.os == 'macOS'
        run: scripts/package-macos.sh
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p peel-app -p peel-cli -p peel-host-clap -p peel-host-vst3 --bins
          New-Item -ItemType Directory -Force dist/PeacheyStudio | Out-Null
          Copy-Item target/release/peachey-studio.exe dist/PeacheyStudio/
          Copy-Item target/release/peel.exe dist/PeacheyStudio/
          Copy-Item target/release/peel-clap-scan.exe dist/PeacheyStudio/
          Copy-Item target/release/peel-vst3-scan.exe dist/PeacheyStudio/
          uv run --no-project --python 3.12.13 scripts/bundle-python.py dist/PeacheyStudio/python
          Copy-Item LICENSE, README.md, assets/LICENSES.md, docs/SCRIPTING.md dist/PeacheyStudio/
          New-Item -ItemType Directory -Force dist/PeacheyStudio/sound-licenses | Out-Null
          Copy-Item assets/drums/big-rusty/LICENSE.txt, assets/drums/big-rusty/README.md, assets/drums/big-rusty/manifest.json dist/PeacheyStudio/sound-licenses/
          New-Item -ItemType Directory -Force dist/PeacheyStudio/sound-licenses/strings | Out-Null
          Copy-Item assets/strings/recorded/LICENSE-guitar.txt, assets/strings/recorded/LICENSE-bass.txt, assets/strings/recorded/README.md, assets/strings/recorded/manifest.json dist/PeacheyStudio/sound-licenses/strings/
          New-Item -ItemType Directory -Force dist/PeacheyStudio/sound-licenses/palm-muted | Out-Null
          Copy-Item assets/strings/palm-muted/LICENSE.txt, assets/strings/palm-muted/NOTICE.txt, assets/strings/palm-muted/README.md, assets/strings/palm-muted/manifest.json dist/PeacheyStudio/sound-licenses/palm-muted/
          Compress-Archive -Path dist/PeacheyStudio -DestinationPath dist/Peachey-Studio-windows-x64.zip
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p peel-app -p peel-cli -p peel-host-clap --bins
          mkdir -p dist/peachey-studio/share/applications dist/peachey-studio/share/icons/hicolor/256x256/apps dist/peachey-studio/bin
          cp target/release/peachey-studio target/release/peel target/release/peel-clap-scan dist/peachey-studio/bin/
          cp packaging/linux/peachey-studio.desktop dist/peachey-studio/share/applications/
          cp assets/icons/peachey-256.png dist/peachey-studio/share/icons/hicolor/256x256/apps/peachey-studio.png
          uv run --no-project --python 3.12.13 scripts/bundle-python.py dist/peachey-studio/lib/peel/python
          cp LICENSE README.md assets/LICENSES.md docs/SCRIPTING.md dist/peachey-studio/
          mkdir -p dist/peachey-studio/sound-licenses
          cp assets/drums/big-rusty/LICENSE.txt assets/drums/big-rusty/README.md assets/drums/big-rusty/manifest.json dist/peachey-studio/sound-licenses/
          mkdir -p dist/peachey-studio/sound-licenses/strings
          cp assets/strings/recorded/LICENSE-guitar.txt assets/strings/recorded/LICENSE-bass.txt assets/strings/recorded/README.md assets/strings/recorded/manifest.json dist/peachey-studio/sound-licenses/strings/
          mkdir -p dist/peachey-studio/sound-licenses/palm-muted
          cp assets/strings/palm-muted/{LICENSE.txt,NOTICE.txt,README.md,manifest.json} dist/peachey-studio/sound-licenses/palm-muted/
          tar -C dist -czf dist/Peachey-Studio-linux-x64.tar.gz peachey-studio
      - uses: actions/upload-artifact@v4
        with:
          name: peachey-studio-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
