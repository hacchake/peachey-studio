[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/peel-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/hacchake/peachey-studio"
authors = ["Dwayne Charrington <dwaynecharrington@gmail.com>"]
rust-version = "1.99"

[workspace.dependencies]
# Internal crates
peel-time = { path = "crates/peel-time" }
peel-document = { path = "crates/peel-document" }
peel-dsp = { path = "crates/peel-dsp" }
peel-instruments = { path = "crates/peel-instruments" }
peel-effects = { path = "crates/peel-effects" }
peel-devices = { path = "crates/peel-devices" }
peel-engine = { path = "crates/peel-engine" }
peel-media = { path = "crates/peel-media" }
peel-project = { path = "crates/peel-project" }
peel-midi = { path = "crates/peel-midi" }
peel-session = { path = "crates/peel-session" }
peel-ui = { path = "crates/peel-ui" }
peel-compose = { path = "crates/peel-compose" }
peel-extensions = { path = "crates/peel-extensions" }

# External crates (pinned minor versions; Cargo.lock pins exact builds)
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
rtrb = "0.4"
cpal = "0.18"
wgpu = "30"
winit = "0.30"
glyphon = "0.12"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
log = "0.4"
env_logger = "0.11"
blake3 = "1"
hound = "3.5"
symphonia = { version = "0.6", default-features = false }
midly = "0.5"
rfd = "0.18"
dirs = "7"

[profile.dev]
opt-level = 1

# DSP and the realtime engine must be fast even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.peel-dsp]
opt-level = 3

[profile.dev.package.peel-instruments]
opt-level = 3

[profile.dev.package.peel-effects]
opt-level = 3

[profile.dev.package.peel-engine]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
debug = "line-tables-only"
